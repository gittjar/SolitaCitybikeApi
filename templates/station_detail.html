<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed top-4 right-4 z-50 transform transition-all duration-300 ease-in-out">
        <div id="toastContent" class="bg-white rounded-xl shadow-lg border px-6 py-4 flex items-center gap-3 min-w-[300px]">
            <span id="toastIcon" class="text-2xl"></span>
            <p id="toastMessage" class="text-sm font-light flex-1"></p>
            <button onclick="hideToast()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Back Button -->
        <div class="mb-6">
            <a href="/" class="inline-flex items-center gap-2 text-slate-600 hover:text-slate-900 transition-colors">
                <span>←</span>
                <span class="font-light">Back to List</span>
            </a>
        </div>

        <!-- Loading State -->
        <div id="loading" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-12 text-center">
            <div class="inline-block animate-spin text-4xl text-slate-300 mb-2">↻</div>
            <p class="text-slate-500 font-light">Loading station details...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden bg-red-50 border border-red-200 rounded-2xl p-6 text-center">
            <div class="text-3xl text-red-400 mb-2">↯</div>
            <p class="text-red-700 font-light" id="errorMessage"></p>
        </div>

        <!-- Station Detail -->
        <div id="stationDetail" class="hidden">
            <!-- Image Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-6">
                <div id="imageContainer" class="aspect-video bg-slate-100 flex items-center justify-center">
                    <div class="text-center text-slate-400">
                        <div class="text-6xl mb-4">↓</div>
                        <p class="font-light">Image should be here but not uploaded!</p>
                    </div>
                </div>
            </div>

            <!-- Edit Modal -->
            <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 overflow-y-auto">
                <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-8 my-8">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-2xl font-light text-slate-900">Edit Station</h3>
                        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-2xl">✕</button>
                    </div>
                    
                    <form id="editForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-2 uppercase tracking-wide">Name (Finnish)</label>
                                <input type="text" id="editNimi" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-2 uppercase tracking-wide">Name (Swedish)</label>
                                <input type="text" id="editNamn" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-2 uppercase tracking-wide">Name (English)</label>
                            <input type="text" id="editName" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-2 uppercase tracking-wide">Address (Finnish)</label>
                                <input type="text" id="editOsoite" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-2 uppercase tracking-wide">Address (Swedish)</label>
                                <input type="text" id="editAdress" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-2 uppercase tracking-wide">City</label>
                                <input type="text" id="editKaupunki" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-2 uppercase tracking-wide">Operator</label>
                                <input type="text" id="editOperaattor" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-2 uppercase tracking-wide">Capacity</label>
                                <input type="number" id="editKapasiteet" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-2 uppercase tracking-wide">FID</label>
                                <input type="number" id="editFID" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-2 uppercase tracking-wide">Stad</label>
                                <input type="text" id="editStad" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-2 uppercase tracking-wide">Longitude (x)</label>
                                <input type="number" step="any" id="editX" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-2 uppercase tracking-wide">Latitude (y)</label>
                                <input type="number" step="any" id="editY" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-2 uppercase tracking-wide">Image URL</label>
                            <input type="url" id="editKuva" placeholder="https://..." class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent">
                        </div>

                        <div class="flex gap-3 pt-4">
                            <button type="button" onclick="closeEditModal()" class="flex-1 px-4 py-2.5 border border-slate-200 text-slate-700 rounded-lg hover:bg-slate-50 transition-colors font-light">
                                Cancel
                            </button>
                            <button type="submit" class="flex-1 px-4 py-2.5 bg-slate-900 text-white rounded-lg hover:bg-slate-800 transition-colors font-light">
                                Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Info Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
                <div class="flex items-start justify-between mb-6 pb-6 border-b border-slate-100">
                    <div class="flex-1">
                        <h1 id="stationName" class="text-3xl font-light text-slate-900 mb-2"></h1>
                        <p id="stationNameAlt" class="text-lg text-slate-500 font-light"></p>
                    </div>
                    <span id="stationId" class="px-3 py-1.5 bg-slate-100 text-slate-600 text-sm rounded-full font-mono"></span>
                </div>

                <!-- Details Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="flex items-start gap-3">
                        <span class="text-slate-300 mt-0.5">→</span>
                        <div class="flex-1">
                            <div class="text-xs text-slate-500 uppercase tracking-wide mb-1">Address</div>
                            <div id="stationAddress" class="text-base text-slate-900 font-light"></div>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <span class="text-slate-300 mt-0.5">→</span>
                        <div class="flex-1">
                            <div class="text-xs text-slate-500 uppercase tracking-wide mb-1">City</div>
                            <div id="stationCity" class="text-base text-slate-900 font-light"></div>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <span class="text-slate-300 mt-0.5">→</span>
                        <div class="flex-1">
                            <div class="text-xs text-slate-500 uppercase tracking-wide mb-1">Capacity</div>
                            <div class="inline-block px-3 py-1 bg-slate-900 text-white text-sm rounded-full font-light" id="stationCapacity"></div>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <span class="text-slate-300 mt-0.5">→</span>
                        <div class="flex-1">
                            <div class="text-xs text-slate-500 uppercase tracking-wide mb-1">Operator</div>
                            <div id="stationOperator" class="text-base text-slate-900 font-light"></div>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <span class="text-slate-300 mt-0.5">→</span>
                        <div class="flex-1">
                            <div class="text-xs text-slate-500 uppercase tracking-wide mb-1">Coordinates</div>
                            <div id="stationCoords" class="text-base text-slate-900 font-light font-mono text-sm"></div>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <span class="text-slate-300 mt-0.5">→</span>
                        <div class="flex-1">
                            <div class="text-xs text-slate-500 uppercase tracking-wide mb-1">FID</div>
                            <div id="stationFID" class="text-base text-slate-900 font-light"></div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-3">
                    <button onclick="openEditModal()" class="flex-1 px-6 py-3 bg-slate-900 text-white rounded-lg hover:bg-slate-800 transition-colors font-light flex items-center justify-center gap-2">
                        <span>Edit Station</span>
                        <span>→</span>
                    </button>
                    <button onclick="openDeleteModal()" class="px-6 py-3 border border-red-200 text-red-600 rounded-lg hover:bg-red-50 transition-colors font-light flex items-center justify-center gap-2">
                        <span>Delete</span>
                        <span>✕</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
            <h3 class="text-xl font-light text-slate-900 mb-4">Confirm Delete</h3>
            <p class="text-slate-600 font-light mb-6">Are you sure you want to delete this station? This action cannot be undone.</p>
            <div class="flex gap-3">
                <button onclick="closeDeleteModal()" class="flex-1 px-4 py-2.5 border border-slate-200 text-slate-700 rounded-lg hover:bg-slate-50 transition-colors font-light">
                    Cancel
                </button>
                <button onclick="confirmDelete()" class="flex-1 px-4 py-2.5 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors font-light">
                    Delete
                </button>
            </div>
        </div>
    </div>

    <script>
        const stationId = {{ station_id | tojson }};
        let stationData = null;

        // Toast notification system
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastContent = document.getElementById('toastContent');
            const toastIcon = document.getElementById('toastIcon');
            const toastMessage = document.getElementById('toastMessage');
            
            // Set content based on type
            if (type === 'success') {
                toastContent.className = 'bg-white rounded-xl shadow-lg border border-green-200 px-6 py-4 flex items-center gap-3 min-w-[300px]';
                toastIcon.textContent = '✓';
                toastIcon.className = 'text-2xl text-green-600';
                toastMessage.className = 'text-sm font-light flex-1 text-slate-900';
            } else if (type === 'error') {
                toastContent.className = 'bg-white rounded-xl shadow-lg border border-red-200 px-6 py-4 flex items-center gap-3 min-w-[300px]';
                toastIcon.textContent = '✕';
                toastIcon.className = 'text-2xl text-red-600';
                toastMessage.className = 'text-sm font-light flex-1 text-slate-900';
            } else if (type === 'info') {
                toastContent.className = 'bg-white rounded-xl shadow-lg border border-blue-200 px-6 py-4 flex items-center gap-3 min-w-[300px]';
                toastIcon.textContent = 'ⓘ';
                toastIcon.className = 'text-2xl text-blue-600';
                toastMessage.className = 'text-sm font-light flex-1 text-slate-900';
            }
            
            toastMessage.textContent = message;
            toast.classList.remove('hidden');
            
            // Auto-hide after 4 seconds
            setTimeout(() => {
                hideToast();
            }, 4000);
        }

        function hideToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('hidden');
        }

        // Load station details
        window.onload = function() {
            // Attach form event listener - wait a bit for DOM to be fully ready
            setTimeout(() => {
                const editForm = document.getElementById('editForm');
                if (editForm) {
                    editForm.addEventListener('submit', submitEditForm);
                }
            }, 100);
            
            fetch(`/api/station/${stationId}`)
                .then(response => response.json())
                .then(station => {
                    if (station.error) {
                        showError(station.error);
                        return;
                    }
                    
                    stationData = station;
                    displayStation(station);
                })
                .catch(error => {
                    showError(error.message);
                });
        };

        function displayStation(station) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('stationDetail').classList.remove('hidden');

            document.getElementById('stationName').textContent = station.Nimi || 'N/A';
            document.getElementById('stationNameAlt').textContent = station.Name || '';
            document.getElementById('stationId').textContent = `#${station.ID}`;
            document.getElementById('stationAddress').textContent = station.Osoite || station.Adress || 'N/A';
            document.getElementById('stationCity').textContent = station.Kaupunki || 'N/A';
            document.getElementById('stationCapacity').textContent = `${station.Kapasiteet || 'N/A'} bikes`;
            document.getElementById('stationOperator').textContent = station.Operaattor || 'N/A';
            document.getElementById('stationCoords').textContent = `${station.y}, ${station.x}`;
            document.getElementById('stationFID').textContent = station.FID || 'N/A';

            // Display image if available
            if (station.Kuva && station.Kuva.trim() !== '') {
                const imageContainer = document.getElementById('imageContainer');
                imageContainer.innerHTML = `
                    <img src="${station.Kuva}" 
                         alt="${station.Nimi}" 
                         class="w-full h-full object-cover"
                         onerror="this.parentElement.innerHTML='<div class=\\'text-center text-slate-400\\'><div class=\\'text-6xl mb-4\\'>↓</div><p class=\\'font-light\\'>Image should be here but not uploaded!</p></div>'">
                `;
            }
        }

        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('errorMessage').textContent = message;
        }

        function openEditModal() {
            document.getElementById('editModal').classList.remove('hidden');
            
            // Populate form with current station data
            document.getElementById('editNimi').value = stationData.Nimi || '';
            document.getElementById('editNamn').value = stationData.Namn || '';
            document.getElementById('editName').value = stationData.Name || '';
            document.getElementById('editOsoite').value = stationData.Osoite || '';
            document.getElementById('editAdress').value = stationData.Adress || '';
            document.getElementById('editKaupunki').value = stationData.Kaupunki || '';
            document.getElementById('editOperaattor').value = stationData.Operaattor || '';
            document.getElementById('editKapasiteet').value = stationData.Kapasiteet || '';
            document.getElementById('editFID').value = stationData.FID || '';
            document.getElementById('editStad').value = stationData.Stad || '';
            document.getElementById('editX').value = stationData.x || '';
            document.getElementById('editY').value = stationData.y || '';
            document.getElementById('editKuva').value = stationData.Kuva || '';
        }
        
        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }
        
        // Handle edit form submission
        function submitEditForm(e) {
            e.preventDefault();
            
            const updatedData = {
                Nimi: document.getElementById('editNimi').value,
                Namn: document.getElementById('editNamn').value,
                Name: document.getElementById('editName').value,
                Osoite: document.getElementById('editOsoite').value,
                Adress: document.getElementById('editAdress').value,
                Kaupunki: document.getElementById('editKaupunki').value,
                Operaattor: document.getElementById('editOperaattor').value,
                Kapasiteet: parseInt(document.getElementById('editKapasiteet').value),
                FID: parseInt(document.getElementById('editFID').value),
                Stad: document.getElementById('editStad').value,
                x: parseFloat(document.getElementById('editX').value),
                y: parseFloat(document.getElementById('editY').value),
                Kuva: document.getElementById('editKuva').value
            };
            
            fetch(`/api/station/${stationId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updatedData)
            })
            .then(response => response.json())
            .then(result => {
                if (result.error) {
                    showToast(result.error, 'error');
                    return;
                }
                closeEditModal();
                showToast('Station updated successfully!', 'success');
                // Reload data without page refresh
                setTimeout(() => {
                    window.location.reload();
                }, 1000);
            })
            .catch(error => {
                showToast('Error: ' + error.message, 'error');
            });
        }

        function openDeleteModal() {
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
        }

        function confirmDelete() {
            fetch(`/api/station/${stationId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(result => {
                if (result.error) {
                    showToast(result.error, 'error');
                    return;
                }
                closeDeleteModal();
                showToast('Station deleted successfully!', 'success');
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            })
            .catch(error => {
                showToast('Error: ' + error.message, 'error');
            });
        }
    </script>
</body>
</html>
